[package]
name = "metryx-desktop"
version = "1.5.3"
description = "Windows shell for the Metryx dashboard"
edition = "2021"
publish = false

[[bin]]
name = "metryx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
