[package]
name = "token-telemetry-desktop"
version = "1.5.2"
description = "Windows shell for the Token Telemetry dashboard"
edition = "2021"
publish = false

[[bin]]
name = "token-telemetry"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
